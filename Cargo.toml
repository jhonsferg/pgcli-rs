[workspace]
resolver = "2"
members = [
    "crates/pgcli-core",
    "crates/pgcli-connection",
    "crates/pgcli-executor",
    "crates/pgcli-output",
    "crates/pgcli-meta",
    "crates/pgcli-repl",
    "crates/pgcli-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["pgcli-rs contributors"]
license = "MIT"
repository = "https://github.com/jhonsferg/pgcli-rs"
publish = false

[workspace.dependencies]
# Internal crates
pgcli-core       = { path = "crates/pgcli-core" }
pgcli-connection = { path = "crates/pgcli-connection", default-features = false }
pgcli-executor   = { path = "crates/pgcli-executor" }
pgcli-output     = { path = "crates/pgcli-output" }
pgcli-meta       = { path = "crates/pgcli-meta" }
pgcli-repl       = { path = "crates/pgcli-repl" }

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# PostgreSQL wire protocol (pure Rust, no libpq)
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# TLS support
tokio-native-tls = "0.3"
native-tls = "0.2"
postgres-native-tls = "0.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"

# REPL / interactive editing
rustyline = { version = "18", features = ["with-file-history"] }
rustyline-derive = "0.12"

# Terminal output and formatting
crossterm = "0.29"
colored = "3"

# Output formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# Error handling
thiserror = "2"

# Configuration
toml = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
rand = "0.10"
rpassword = "7"

# Development
tokio-test = "0.4"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
