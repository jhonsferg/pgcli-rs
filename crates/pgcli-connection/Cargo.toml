[package]
name = "pgcli-connection"
description = "PostgreSQL connection configuration, pooling and TLS for pgcli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native-tls-backend"]
native-tls-backend = ["tokio-native-tls", "native-tls", "postgres-native-tls"]
rustls-backend = ["tokio-rustls", "rustls", "rustls-pki-types", "webpki-roots"]

[dependencies]
dirs.workspace = true
pgcli-core.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true

native-tls = { workspace = true, optional = true }
postgres-native-tls = { workspace = true, optional = true }
tokio-native-tls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
